<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Student Portal</title>
  <meta name="description" content="Student portal: dashboard, class schedule, grades, announcements and profile.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script>
    // Apply saved theme before paint to avoid a flash
    (function () {
      try {
        var t = JSON.parse(localStorage.getItem('sp:theme'));
        if (!t) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    })();
  </script>
</head>
<body>

<!-- Icon sprite -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="i-home" viewBox="0 0 24 24"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></symbol>
    <symbol id="i-calendar" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></symbol>
    <symbol id="i-chart" viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></symbol>
    <symbol id="i-bell" viewBox="0 0 24 24"><path d="M18 8a6 6 0 10-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 01-3.4 0"/></symbol>
    <symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-7 8-7s8 3 8 7"/></symbol>
    <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></symbol>
    <symbol id="i-moon" viewBox="0 0 24 24"><path d="M21 13A9 9 0 1111 3a7 7 0 0010 10z"/></symbol>
    <symbol id="i-menu" viewBox="0 0 24 24"><path d="M3 6h18M3 12h18M3 18h18"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></symbol>
    <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
    <symbol id="i-pin" viewBox="0 0 24 24"><path d="M12 22s7-6.2 7-12a7 7 0 10-14 0c0 5.8 7 12 7 12z"/><circle cx="12" cy="10" r="2.5"/></symbol>
    <symbol id="i-book" viewBox="0 0 24 24"><path d="M4 4h12a4 4 0 014 4v12H8a4 4 0 01-4-4z"/><path d="M4 16a4 4 0 014-4h12"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12l5 5 9-10"/></symbol>
    <symbol id="i-flag" viewBox="0 0 24 24"><path d="M5 22V4M5 4h13l-2 4 2 4H5"/></symbol>
    <symbol id="i-cap" viewBox="0 0 24 24"><path d="M2 9l10-5 10 5-10 5z"/><path d="M6 11.5V17c0 1.5 3 3 6 3s6-1.5 6-3v-5.5"/></symbol>
  </defs>
</svg>

<a class="skip-link" href="#main">Skip to content</a>

<div class="shell">
  <aside class="sidebar" id="sidebar" aria-label="Primary">
    <div class="brand">
      <span class="brand-mark"><svg class="ic"><use href="#i-cap"/></svg></span>
      <span class="brand-text">Northbridge<small>Student Portal</small></span>
    </div>

    <nav class="nav" id="nav">
      <a href="#/dashboard" data-route="dashboard"><svg class="ic"><use href="#i-home"/></svg><span>Dashboard</span></a>
      <a href="#/schedule" data-route="schedule"><svg class="ic"><use href="#i-calendar"/></svg><span>Class Schedule</span></a>
      <a href="#/grades" data-route="grades"><svg class="ic"><use href="#i-chart"/></svg><span>Grades</span></a>
      <a href="#/announcements" data-route="announcements"><svg class="ic"><use href="#i-bell"/></svg><span>Announcements</span><b class="pill" id="navBadge" hidden>0</b></a>
      <a href="#/profile" data-route="profile"><svg class="ic"><use href="#i-user"/></svg><span>My Profile</span></a>
    </nav>

    <div class="sidebar-foot">
      <div class="mini-profile" id="miniProfile"></div>
    </div>
  </aside>
  <div class="scrim" id="scrim"></div>

  <div class="content">
    <header class="topbar">
      <button class="icon-btn only-mobile" id="menuBtn" aria-label="Open menu" aria-controls="sidebar" aria-expanded="false"><svg class="ic"><use href="#i-menu"/></svg></button>
      <div class="topbar-title">
        <h1 id="pageTitle">Dashboard</h1>
        <p id="pageSub"></p>
      </div>
      <div class="topbar-actions">
        <a class="icon-btn" href="#/announcements" aria-label="Announcements"><svg class="ic"><use href="#i-bell"/></svg><i class="dot" id="bellDot" hidden></i></a>
        <button class="icon-btn" id="themeBtn" aria-label="Toggle dark mode"><svg class="ic"><use id="themeIcon" href="#i-moon"/></svg></button>
      </div>
    </header>

    <main id="main" tabindex="-1">
      <section class="view" id="view-dashboard" hidden></section>
      <section class="view" id="view-schedule" hidden></section>
      <section class="view" id="view-grades" hidden></section>
      <section class="view" id="view-announcements" hidden></section>
      <section class="view" id="view-profile" hidden></section>
    </main>

    <footer class="foot">Demo portal with sample data. Edits are saved in your browser only.</footer>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
